apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-chromadb
  labels:
    app.kubernetes.io/name: chromadb
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: vector-store
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: chromadb
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: chromadb
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: vector-store
    spec:
      containers:
        - name: chromadb
          image: {{ .Values.chromadb.image }}
          ports:
            - containerPort: 8000
              protocol: TCP
          env:
            - name: PERSIST_DIRECTORY
              value: /chroma/data
          readinessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
          volumeMounts:
            - name: chroma-data
              mountPath: /chroma
            - name: chroma-data
              mountPath: /data
          resources:
            requests:
              cpu: {{ .Values.chromadb.resources.requests.cpu }}
              memory: {{ .Values.chromadb.resources.requests.memory }}
            limits:
              cpu: {{ .Values.chromadb.resources.limits.cpu }}
              memory: {{ .Values.chromadb.resources.limits.memory }}
      volumes:
        - name: chroma-data
          emptyDir: {}
