{{- if .Values.rag.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-rag
  labels:
    app.kubernetes.io/name: rag-service
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: backend
spec:
  {{- if .Values.rag.persistence.storageClassName }}
  storageClassName: {{ .Values.rag.persistence.storageClassName | quote }}
  {{- end }}
  accessModes: {{ toYaml .Values.rag.persistence.accessModes | nindent 4 }}
  resources:
    requests:
      storage: {{ .Values.rag.storageSize }}
{{- end }}
