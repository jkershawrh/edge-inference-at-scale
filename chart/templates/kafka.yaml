apiVersion: kafka.strimzi.io/v1
kind: KafkaNodePool
metadata:
  name: {{ .Release.Name }}-kafka-pool
  labels:
    strimzi.io/cluster: {{ .Release.Name }}-kafka
spec:
  replicas: {{ .Values.kafka.replicas | default 1 }}
  roles:
    - controller
    - broker
  storage:
    type: ephemeral
  resources:
    requests:
      cpu: {{ .Values.kafka.resources.requests.cpu | default "250m" }}
      memory: {{ .Values.kafka.resources.requests.memory | default "512Mi" }}
    limits:
      cpu: {{ .Values.kafka.resources.limits.cpu | default "500m" }}
      memory: {{ .Values.kafka.resources.limits.memory | default "1Gi" }}
---
apiVersion: kafka.strimzi.io/v1
kind: Kafka
metadata:
  name: {{ .Release.Name }}-kafka
  labels:
    app.kubernetes.io/name: kafka
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: messaging
  annotations:
    strimzi.io/kraft: enabled
    strimzi.io/node-pools: enabled
spec:
  kafka:
    version: {{ .Values.kafka.version | default "4.2.0" }}
    listeners:
      - name: plain
        port: 9092
        type: internal
        tls: false
    config:
      auto.create.topics.enable: "true"
      log.retention.hours: 24
      offsets.topic.replication.factor: 1
      transaction.state.log.replication.factor: 1
      transaction.state.log.min.isr: 1
  entityOperator:
    topicOperator: {}
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: sms.inbound
  labels:
    strimzi.io/cluster: {{ .Release.Name }}-kafka
spec:
  partitions: 1
  replicas: 1
  config:
    retention.ms: "86400000"
