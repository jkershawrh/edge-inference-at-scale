apiVersion: kafka.strimzi.io/v1beta2
kind: Kafka
metadata:
  name: {{ .Release.Name }}-kafka
  labels:
    app.kubernetes.io/name: kafka
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: messaging
spec:
  kafka:
    version: {{ .Values.kafka.version | default "3.7.0" }}
    replicas: {{ .Values.kafka.replicas | default 1 }}
    listeners:
      - name: plain
        port: 9092
        type: internal
        tls: false
    config:
      auto.create.topics.enable: "true"
      log.retention.hours: 24
      offsets.topic.replication.factor: 1
      transaction.state.log.replication.factor: 1
      transaction.state.log.min.isr: 1
    storage:
      type: ephemeral
    resources:
      requests:
        cpu: {{ .Values.kafka.resources.requests.cpu | default "250m" }}
        memory: {{ .Values.kafka.resources.requests.memory | default "512Mi" }}
      limits:
        cpu: {{ .Values.kafka.resources.limits.cpu | default "500m" }}
        memory: {{ .Values.kafka.resources.limits.memory | default "1Gi" }}
  zookeeper:
    replicas: 1
    storage:
      type: ephemeral
    resources:
      requests:
        cpu: 125m
        memory: 256Mi
      limits:
        cpu: 250m
        memory: 512Mi
  entityOperator:
    topicOperator: {}
---
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: sms.inbound
  labels:
    strimzi.io/cluster: {{ .Release.Name }}-kafka
spec:
  partitions: 1
  replicas: 1
  config:
    retention.ms: "86400000"
