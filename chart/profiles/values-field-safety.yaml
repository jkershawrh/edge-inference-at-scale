# Field behavior overlay. Apply with a hardware resource profile and a signed,
# event-specific corpus configuration.
safety:
  groundingRequired: true
  emergencyRagEnabled: true

rag:
  # Require semantic support in addition to lexical/rank-fusion confidence.
  # This blocks accidental overlaps such as an unrelated query containing the
  # word "number" matching a phone-number document.
  minVectorConfidence: 0.25
