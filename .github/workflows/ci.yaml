name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Python syntax check
        run: python -m compileall -q backend corpus_factory scripts tests
      - name: Helm lint
        run: |
          curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
          helm lint chart/

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements-test.txt
      - name: Run convergence matrix
        run: make test-all PYTHON=python
      - name: Retain convergence evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: convergence-local
          path: artifacts/convergence-local.json
          if-no-files-found: warn

  container:
    name: Container Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -f backend/Dockerfile -t edge-backend:test backend/
      - name: Verify image
        run: docker run --rm edge-backend:test python3.11 -c "from backend.shared.config import settings; print(f'node_id={settings.node_id}')"
