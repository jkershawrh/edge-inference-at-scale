apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: lil-evy-field
  namespace: openshift-gitops
spec:
  project: default
  source:
    repoURL: https://github.com/jkershawrh/edge-inference-at-scale.git
    targetRevision: main
    path: chart
    helm:
      releaseName: lil-evy
      valueFiles:
        - profiles/values-field-safety.yaml
        - profiles/values-gitops-release.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: lil-evy-field
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
      - RespectIgnoreDifferences=true
  ignoreDifferences:
    - group: apps
      kind: Deployment
      name: lil-evy-rag-service
      namespace: lil-evy-field
      jsonPointers:
        - /spec/template/metadata/annotations/lilevy.edge~1restart-operation-id
        - /spec/template/metadata/annotations/lilevy.edge~1target-digest
        - /spec/template/metadata/annotations/lilevy.edge~1target-sequence
