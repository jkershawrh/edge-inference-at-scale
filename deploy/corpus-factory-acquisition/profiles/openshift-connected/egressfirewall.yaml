apiVersion: network.openshift.io/v1
kind: EgressFirewall
metadata:
  name: default
spec:
  egress:
    # This list must exactly mirror enabled registry allowed_hosts. Add rules
    # through reviewed Git changes; never permit a wildcard or arbitrary crawl.
    - type: Allow
      to:
        dnsName: alerts.example.gov
      ports:
        - protocol: TCP
          port: 443
    - type: Deny
      to:
        cidrSelector: 0.0.0.0/0
    - type: Deny
      to:
        cidrSelector: ::/0
