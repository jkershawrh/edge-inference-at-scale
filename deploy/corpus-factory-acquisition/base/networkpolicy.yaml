apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: corpus-acquisition-default-deny
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: corpus-acquisition-controller
  policyTypes: ["Ingress", "Egress"]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: corpus-acquisition-explicit-egress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: corpus-acquisition-controller
  policyTypes: ["Egress"]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openshift-dns
          podSelector:
            matchLabels:
              dns.operator.openshift.io/daemonset-dns: default
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
