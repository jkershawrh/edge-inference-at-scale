# Core Convergence Matrix
#
# RED: a required command failed or a capability claim is contradicted.
# AMBER: exercised behavior passed, but checks were skipped or target/live
#        evidence is absent. AMBER is never silently promoted to GREEN.
# GREEN: every required check passed with attributable evidence for this scope.
#
# CUT is capability-and-user testing for the field product. The demo's CBT
# (component-based testing) is one input to CUT; a green demo cannot promote
# the field product by itself.

version: "2.0"
rubric:
  red: "Required failure, contradicted behavior, or unsupported release claim"
  amber: "Passing partial/simulated evidence with skips or missing target evidence"
  green: "All required checks passed for the declared profile with retained evidence"
  policy:
    - "Do not average colors; any RED makes the overall result RED"
    - "Any AMBER makes the overall result AMBER"
    - "PENDING or skipped evidence is AMBER, never GREEN"
    - "Evidence is bound to the selected code, corpus, model, runtime, channel, and profile"

stages:
  stage_0_cdd:
    id: CDD
    name: Contract-driven development
    purpose: "Validate API, corpus, signing, activation, and rollout contracts"
    gate: null
    execution:
      local:
        commands:
          - argv: [python3, -m, pytest, tests/contracts/, tests/corpus_factory/, -q, -rs]
      openshift:
        commands:
          - argv: [python3, -m, pytest, tests/contracts/, tests/corpus_factory/, -q, -rs]
    green_requires:
      - "No contract checks skipped"
      - "Signed immutable corpus and anti-rollback contracts pass"
      - "Channel-neutral message and activation contracts pass"

  stage_1_tdd:
    id: TDD
    name: Test-driven development
    purpose: "Exercise isolated core behavior and failure handling"
    gate: stage_0_cdd
    execution:
      local:
        commands:
          - argv: [python3, -m, pytest, tests/unit/, -q, -rs]
      openshift:
        commands:
          - argv: [python3, -m, pytest, tests/unit/, -q, -rs]
    green_requires:
      - "No unit checks skipped"
      - "Fail-closed RAG, activation, recovery, and rollout behavior pass"
      - "SMS, simulator, Discord, and LoRa envelopes remain channel-neutral"

  stage_2_integration:
    id: INT
    name: Core integration
    purpose: "Prove offline serving, signed cutover, restart recovery, and suitability flow"
    gate: stage_1_tdd
    execution:
      local:
        commands:
          - argv: [python3, -m, pytest, tests/integration/, -q, -rs]
      openshift:
        commands:
          - argv: [python3, -m, pytest, tests/integration/, -q, -rs]
    green_requires:
      - "Active corpus survives restart and failed candidates"
      - "Answers retain release and evidence attribution"
      - "Synthetic event fails before correction and passes after correction"

  stage_3_edd:
    id: EDD
    name: Evaluation-driven development
    purpose: "Measure retrieval, answer quality, latency, and capacity independently"
    gate: stage_2_integration
    execution:
      local:
        status_cap: AMBER
        reason: "mocked capacity cannot qualify live RAG, model, or target latency"
        commands:
          - argv: [python3, -m, pytest, tests/benchmarks/test_capacity.py, -q, -rs]
            env:
              CAPACITY_RESULTS_FILE: artifacts/capacity-local.json
      openshift:
        required_env:
          - EDGE_NAMESPACE
          - EDGE_RELEASE
          - EDGE_API_URL
          - CORPUS_DIGEST
          - CORPUS_MANIFEST_DIGEST
          - CORPUS_MODE
          - CORPUS_EVENT_ID
          - CORPUS_VERSION
          - EMBEDDING_MODEL
          - GENERATION_ENABLED
          - LLM_PROVIDER
          - LLM_MODEL
          - EDGE_RESOURCE_PROFILE
          - CHANNEL_DRIVER
        commands:
          - argv: [python3, scripts/openshift_edd_preflight.py]
          - argv: [python3, tests/evaluation/run_retrieval_eval.py]
            env:
              RAG_EVAL_PATH: /rag/search
            env_from:
              RAG_EVAL_URL: EDGE_API_URL
          - argv: [python3, tests/evaluation/run_eval.py]
            env:
              EVAL_RESULTS_FILE: artifacts/response-eval-openshift.json
            env_from:
              EVAL_API_URL: EDGE_API_URL
          - argv: [python3, -m, pytest, "tests/benchmarks/test_capacity.py::TestLiveCapacity", -q, -rs]
            env:
              CAPACITY_LIVE: "1"
              CAPACITY_RESULTS_FILE: artifacts/capacity-openshift.json
            env_from:
              EVAL_API_URL: EDGE_API_URL
    green_requires:
      - "Retrieval recall, rank, and p50/p95 latency meet the rubric"
      - "Answer quality and safe no-answer behavior meet the event policy"
      - "Live capacity passes on the declared OpenShift resource profile"
      - "Evidence records corpus, embedding, model, runtime, and profile identities"

  stage_4_bdd:
    id: BDD
    name: Behavior-driven development
    purpose: "Validate user journeys through the selected message transport"
    gate: stage_3_edd
    execution:
      local:
        status_cap: AMBER
        reason: "field journeys use synthetic guidance; approved event corpus and representative users remain required"
        commands:
          - argv: [python3, -m, pytest, tests/bdd/, -q, -rs]
      openshift:
        status_cap: AMBER
        reason: "field-specific journeys and human approval remain required"
        commands:
          - argv: [python3, -m, pytest, tests/bdd/, -q, -rs]
    green_requires:
      - "Offline question, supported answer, no-evidence refusal, and emergency bypass pass"
      - "SMS segmentation and retry behavior pass on the selected channel"
      - "Scenarios use the approved event corpus and local-language policy"

  stage_5_cut:
    id: CUT
    name: Capability and user testing
    purpose: "Qualify the complete field capability; CBT validates only component behavior"
    gate: stage_4_bdd
    execution:
      local:
        status_cap: AMBER
        reason: "no field hardware, GSM path, power profile, or representative user exercise"
        commands:
          - argv: [python3, -m, pytest, tests/integration/test_lil_evy_field_core.py, -q, -rs]
      openshift:
        status_cap: AMBER
        reason: "OpenShift proves software behavior but not field hardware, radio, or power"
        commands:
          - argv: [python3, -m, pytest, tests/integration/test_lil_evy_field_core.py, -q, -rs]
    green_requires:
      - "Representative users complete approved field tasks"
      - "GSM/SMS delivery works with selected modem, carrier, and antenna conditions"
      - "Power, thermal, storage, reconnect, and recovery drills pass on target hardware"
      - "Accessibility, privacy, safety, and operational review are approved"

  stage_6_publication:
    id: PUB
    name: Publication and claims
    purpose: "Keep repository instructions, links, architecture, and claims publishable"
    gate: stage_5_cut
    execution:
      local:
        commands:
          - argv: [python3, -m, pytest, tests/publication/, -q, -rs]
      openshift:
        commands:
          - argv: [python3, -m, pytest, tests/publication/, -q, -rs]
    green_requires:
      - "README structure and local links pass"
      - "No template repository URLs remain"
      - "Unverified measurements stay explicitly projected or AMBER"
